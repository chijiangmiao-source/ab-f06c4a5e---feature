services:
  ltl:
    build: .
    image: ltl-interlock:latest
    environment:
      # 端口可调：设置 LTL_PORT（容器内监听）与 LTL_HOST_PORT（宿主机映射）
      LTL_PORT: "${LTL_PORT:-8080}"
      LTL_DATA_DIR: /data
    ports:
      - "${LTL_HOST_PORT:-8080}:${LTL_PORT:-8080}"
    volumes:
      - ltl-audit:/data
    healthcheck:
      test: ["CMD", "python", "/srv/app/healthcheck.py"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  verify:
    build: .
    image: ltl-interlock:latest
    depends_on:
      ltl:
        condition: service_healthy
    environment:
      LTL_BASE_URL: "http://ltl:${LTL_PORT:-8080}"
    # 围绕永不放行的违规闭环做：代码测试 + 构建检查 + HTTP 冒烟；
    # 验收完即退出，退出码即验收结论（0 通过 / 非 0 失败）
    entrypoint: ["python", "/srv/scripts/verify.py"]
    restart: "no"

volumes:
  ltl-audit:
